name: artisa

x-db-environment: &db-environment
  DB_HOST: mariadb
  DB_NAME: ${MARIADB_DATABASE:?Ejecuta python3 scripts/prepare_env.py}
  DB_USER: ${MARIADB_USER:?Ejecuta python3 scripts/prepare_env.py}
  DB_PASSWORD: ${MARIADB_PASSWORD:?Ejecuta python3 scripts/prepare_env.py}

x-python-health: &python-health
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
  interval: 5s
  timeout: 5s
  start_period: 15s
  retries: 12

services:
  mariadb:
    image: mariadb:11.8
    container_name: artisa-mariadb
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:?Ejecuta python3 scripts/prepare_env.py}
      MARIADB_USER: ${MARIADB_USER:?Ejecuta python3 scripts/prepare_env.py}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Ejecuta python3 scripts/prepare_env.py}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Ejecuta python3 scripts/prepare_env.py}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
    restart: unless-stopped
    mem_limit: 1g

  mongodb:
    image: mongo:8.0
    container_name: artisa-mongodb
    profiles: ["historical"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12
    restart: unless-stopped
    mem_limit: 1400m

  etl:
    build:
      context: .
      dockerfile: ETLs/Dockerfile
    container_name: artisa-etl
    profiles: ["historical"]
    environment:
      <<: *db-environment
      MONGO_URI: ${MONGO_DOCKER_URI:-mongodb://mongodb:27017}
      MONGO_DATABASE: ${MONGO_DATABASE:-gps_data}
      MONGO_COLLECTION: ${MONGO_COLLECTION:-raw_gps}
      MONGO_TIMEOUT_SECONDS: ${MONGO_TIMEOUT_SECONDS:-10}
      TELEMETRY_BATCH_SIZE: ${TELEMETRY_BATCH_SIZE:-5000}
      TELEMETRY_INTERVAL_SECONDS: ${TELEMETRY_INTERVAL_SECONDS:-300}
    depends_on:
      mariadb:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck: *python-health
    restart: unless-stopped
    mem_limit: 512m
    init: true

  machine:
    build:
      context: .
      dockerfile: modelo_machine/Dockerfile
    container_name: artisa-machine
    volumes:
      - ./exports:/app/exports
    environment:
      <<: *db-environment
      TELEMETRY_MODEL_MAX_ROWS: ${TELEMETRY_MODEL_MAX_ROWS:-5000}
      TELEMETRY_MODEL_INTERVAL_SECONDS: ${TELEMETRY_MODEL_INTERVAL_SECONDS:-300}
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck: *python-health
    restart: unless-stopped
    mem_limit: 768m
    init: true

  route-catalog:
    build:
      context: .
      dockerfile: modelo_machine/Dockerfile
    profiles: ["historical"]
    command: ["python", "-m", "modelo_machine.route_catalog"]
    volumes:
      - ./exports:/app/exports
    environment:
      <<: *db-environment
    depends_on:
      mariadb:
        condition: service_healthy
    mem_limit: 1g
    init: true

  endpoints:
    build:
      context: .
      dockerfile: endpoints/Dockerfile
    container_name: artisa-endpoints
    volumes:
      - ./exports:/app/exports:ro
    environment:
      MAP_CATALOG_FILE: /app/exports/route_catalog.json
      MAP_CATALOG_PILOT_FILE: /app/exports/route_catalog_pilot.json
      <<: *db-environment
      MAP_DATA_SOURCE: ${MAP_DATA_SOURCE:-telemetry}
      MAP_SIMULATION_FILE: ${MAP_SIMULATION_FILE:-/app/simulacion/mapa_procesado.json}
      MAP_MAX_REPORTS: ${MAP_MAX_REPORTS:-3000}
      MAP_REFRESH_SECONDS: ${MAP_REFRESH_SECONDS:-300}
      ETL_HEALTH_MAX_AGE_SECONDS: ${ETL_HEALTH_MAX_AGE_SECONDS:-900}
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck: *python-health
    restart: unless-stopped
    mem_limit: 384m
    init: true

  front:
    build:
      context: .
      dockerfile: front/Dockerfile
    container_name: artisa-front
    environment:
      API_URL: http://endpoints:8000
    depends_on:
      endpoints:
        condition: service_healthy
    healthcheck: *python-health
    restart: unless-stopped
    mem_limit: 256m
    init: true

  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    container_name: artisa-auth
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 128m
    init: true

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: artisa-nginx
    ports:
      - "127.0.0.1:8080:8080"
      - "[::1]:8080:8080"
    depends_on:
      auth:
        condition: service_healthy
      front:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/auth/health"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 128m
    init: true

volumes:
  mariadb_data:
  mongodb_data:


