name: artisa

x-db-environment: &db-environment
  DB_HOST: mariadb
  DB_NAME: ${MARIADB_DATABASE:?Ejecuta python3 scripts/prepare_env.py}
  DB_USER: ${MARIADB_USER:?Ejecuta python3 scripts/prepare_env.py}
  DB_PASSWORD: ${MARIADB_PASSWORD:?Ejecuta python3 scripts/prepare_env.py}

x-python-health: &python-health
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
  interval: 5s
  timeout: 5s
  start_period: 15s
  retries: 12

services:
  mariadb:
    image: mariadb:11.8
    container_name: artisa-mariadb
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:?Ejecuta python3 scripts/prepare_env.py}
      MARIADB_USER: ${MARIADB_USER:?Ejecuta python3 scripts/prepare_env.py}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Ejecuta python3 scripts/prepare_env.py}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Ejecuta python3 scripts/prepare_env.py}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
    restart: unless-stopped

  etl:
    build:
      context: .
      dockerfile: ETLs/Dockerfile
    container_name: artisa-etl
    environment:
      <<: *db-environment
      SOURCE_FILE: /origen/viajes.csv
      ETL_INTERVAL_SECONDS: "15"
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-0}
      SOURCE_API_URL: ${SOURCE_API_URL:-}
      SOURCE_API_TIMEOUT_SECONDS: ${SOURCE_API_TIMEOUT_SECONDS:-90}
      TELEMETRY_START: ${TELEMETRY_START:-2026-03-31T00:00:00}
      TELEMETRY_END: ${TELEMETRY_END:-2026-04-01T00:00:00}
      TELEMETRY_BATCH_SIZE: ${TELEMETRY_BATCH_SIZE:-500}
      TELEMETRY_MAX_TOTAL_ROWS: ${TELEMETRY_MAX_TOTAL_ROWS:-5000}
      TELEMETRY_INTERVAL_SECONDS: ${TELEMETRY_INTERVAL_SECONDS:-300}
      TELEMETRY_CATCHUP_INTERVAL_SECONDS: ${TELEMETRY_CATCHUP_INTERVAL_SECONDS:-5}
      TELEMETRY_RETRY_INTERVAL_SECONDS: ${TELEMETRY_RETRY_INTERVAL_SECONDS:-60}
      TELEMETRY_CONTINUOUS: ${TELEMETRY_CONTINUOUS:-0}
      TELEMETRY_PAGES_PER_CYCLE: ${TELEMETRY_PAGES_PER_CYCLE:-1}
    volumes:
      - ./origen:/origen:ro
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck: *python-health
    restart: unless-stopped
    init: true

  machine:
    build:
      context: .
      dockerfile: modelo_machine/Dockerfile
    container_name: artisa-machine
    environment: *db-environment
    depends_on:
      etl:
        condition: service_healthy
    healthcheck: *python-health
    restart: unless-stopped
    init: true

  endpoints:
    build:
      context: .
      dockerfile: endpoints/Dockerfile
    container_name: artisa-endpoints
    environment:
      <<: *db-environment
      MAP_DATA_SOURCE: ${MAP_DATA_SOURCE:-telemetry}
      MAP_SIMULATION_FILE: ${MAP_SIMULATION_FILE:-/app/simulacion/mapa_procesado.json}
      MAP_MAX_REPORTS: ${MAP_MAX_REPORTS:-30000}
      MAP_REFRESH_SECONDS: ${MAP_REFRESH_SECONDS:-300}
    depends_on:
      machine:
        condition: service_healthy
    healthcheck: *python-health
    restart: unless-stopped
    init: true

  front:
    build:
      context: .
      dockerfile: front/Dockerfile
    container_name: artisa-front
    environment:
      API_URL: http://endpoints:8000
    ports:
      - "0.0.0.0:8080:8000"
    depends_on:
      endpoints:
        condition: service_healthy
    healthcheck: *python-health
    restart: unless-stopped
    init: true

volumes:
  mariadb_data:
