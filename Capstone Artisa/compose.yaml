name: artisa

x-db-environment: &db-environment
  DB_HOST: mariadb
  DB_NAME: ${MARIADB_DATABASE:?Ejecuta python3 scripts/prepare_env.py}
  DB_USER: ${MARIADB_USER:?Ejecuta python3 scripts/prepare_env.py}
  DB_PASSWORD: ${MARIADB_PASSWORD:?Ejecuta python3 scripts/prepare_env.py}

x-python-health: &python-health
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
  interval: 5s
  timeout: 5s
  start_period: 15s
  retries: 12

services:
  mariadb:
    image: mariadb:11.8
    container_name: artisa-mariadb
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:?Ejecuta python3 scripts/prepare_env.py}
      MARIADB_USER: ${MARIADB_USER:?Ejecuta python3 scripts/prepare_env.py}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Ejecuta python3 scripts/prepare_env.py}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Ejecuta python3 scripts/prepare_env.py}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
    restart: unless-stopped

  etl:
    build:
      context: .
      dockerfile: ETLs/Dockerfile
    container_name: artisa-etl
    environment:
      <<: *db-environment
      MONGO_URI: ${MONGO_URI:-mongodb://host.docker.internal:27017}
      MONGO_DATABASE: ${MONGO_DATABASE:-gps_data}
      MONGO_COLLECTION: ${MONGO_COLLECTION:-raw_gps}
      MONGO_TIMEOUT_SECONDS: ${MONGO_TIMEOUT_SECONDS:-10}
      TELEMETRY_BATCH_SIZE: ${TELEMETRY_BATCH_SIZE:-2000}
      TELEMETRY_INTERVAL_SECONDS: ${TELEMETRY_INTERVAL_SECONDS:-30}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck: *python-health
    restart: unless-stopped
    init: true

  machine:
    build:
      context: .
      dockerfile: machine_learning/Dockerfile
    container_name: artisa-machine
    environment:
      <<: *db-environment
      TELEMETRY_MODEL_MAX_ROWS: ${TELEMETRY_MODEL_MAX_ROWS:-20000}
      TELEMETRY_MODEL_RADIUS_KM: ${TELEMETRY_MODEL_RADIUS_KM:-0.8}
      TELEMETRY_MODEL_MIN_SAMPLES: ${TELEMETRY_MODEL_MIN_SAMPLES:-5}
      TELEMETRY_MODEL_INTERVAL_SECONDS: ${TELEMETRY_MODEL_INTERVAL_SECONDS:-30}
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck: *python-health
    restart: unless-stopped
    init: true

  endpoints:
    build:
      context: .
      dockerfile: endpoints/Dockerfile
    container_name: artisa-endpoints
    environment: *db-environment
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck: *python-health
    restart: unless-stopped
    init: true

  front:
    build:
      context: .
      dockerfile: front/Dockerfile
    container_name: artisa-front
    environment:
      API_URL: http://endpoints:8000
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      endpoints:
        condition: service_healthy
    healthcheck: *python-health
    restart: unless-stopped
    init: true

  # auth y nginx: agregados por angelo-dev, todavia no forman parte del
  # camino en vivo (front sigue siendo la entrada real en 8080). Quedan
  # disponibles para levantar y probar aparte hasta que se decida integrarlos.
  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    container_name: artisa-auth
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 12
    restart: unless-stopped
    init: true

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: artisa-nginx
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      auth:
        condition: service_healthy
      front:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/auth/health"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 12
    restart: unless-stopped
    init: true

volumes:
  mariadb_data:
