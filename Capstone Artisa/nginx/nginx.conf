events {}

http {
  proxy_http_version 1.1;
  upstream auth_backend { server auth:8001; }
  upstream front_backend { server front:8000; }

  server {
    listen 8080;

    location = /_auth {
      internal;
      proxy_pass http://auth_backend/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Authorization $http_authorization;
    }

    location = /auth/login {
      proxy_pass http://auth_backend/login;
      proxy_set_header Content-Type $http_content_type;
      proxy_set_header Content-Length $http_content_length;
    }

    location = /auth/health {
      proxy_pass http://auth_backend/health;
    }

    location ^~ /api/ {
      auth_request /_auth;
      proxy_pass http://front_backend;
      proxy_set_header Authorization $http_authorization;
    }

    location ^~ /mensajes {
      auth_request /_auth;
      proxy_pass http://front_backend;
    }

    location / {
      proxy_pass http://front_backend;
    }
  }
}
